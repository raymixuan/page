<!DOCTYPE html>

<head>

<title>GitHub Pages 连通测试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  .card { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);

          box-shadow:0 20px 60px rgba(0,0,0,.5); max-width:560px; }
  .badge { display:inline-block; background:#3fb950; color:#0b2818; font-weight:700;
           padding:6px 18px; border-radius:999px; font-size:14px; letter-spacing:2px; }
  h1 { color:#fff; font-size:30px; margin:24px 0 12px; }
  p  { color:rgba(255,255,255,.65); font-size:15px; line-height:1.9; }
  .meta { margin-top:28px; padding-top:20px; border-top:1px dashed rgba(255,255,255,.15);
          color:rgba(255,255,255,.4); font-size:13px; font-family:Consolas, monospace; }
</style>

<body>
  <div class="card">
    <span class="badge">SUCCESS</span>
    <h1>GitHub Pages 全链路打通</h1>
